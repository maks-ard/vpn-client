# Пример профиля vpnclient. Скопируйте в profile.yaml рядом с vpnclient.exe
# и впишите свои данные. profile.yaml и *.ovpn в git не попадают.

# Зарубежные серверы: ссылка на подписку (https://…) из панели VPN-провайдера.
# Список серверов скачивается при подключении и кэшируется в data/.
subscription:
  url: "https://example.com/sub/TOKEN"
  server: ""               # пусто — самый быстрый автоматически
  user_agent: ""           # по умолчанию v2rayN/7.0

# Либо одна ссылка vless:// вместо подписки.
# Поддерживаются security=reality/tls/none и транспорты tcp, ws, grpc, http, httpupgrade.
# vless: "vless://UUID@server.example.com:443?security=reality&pbk=KEY&sni=www.microsoft.com#my-server"

# Корпоративный OpenVPN. Подключается встроенным в sing-box клиентом,
# отдельный OpenVPN ставить не нужно.
openvpn:
  config: corp.ovpn        # путь относительно этого файла
  # Только если в .ovpn есть auth-user-pass без файла с паролем;
  # при входе по сертификату оставьте пустыми.
  username: ""
  password: ""
  # Адаптер OpenVPN в Windows с адресом из сети компании, как у обычного
  # клиента. Нужен, если серверы компании сами подключаются к компьютеру
  # (например, консоль антивируса). Адреса, которые уходили в OpenVPN,
  # служба запоминает и прокладывает к ним маршруты через этот адаптер.
  system_interface: false

# Что отправлять через OpenVPN. Подсети и DNS-домены, которые присылает
# сервер, добавляются автоматически.
corporate:
  domains:
    - corp.example.com     # вместе со всеми поддоменами
  subnets: []              # например: [10.0.0.0/8]

routing:
  # true: российские сайты (.ru/.su/.рф, geosite и geoip RU) напрямую, остальное через VLESS.
  # false: через VLESS всё, кроме корпоративного и direct_domains.
  russia_direct: true
  direct_domains: []       # всегда напрямую
  proxy_domains: []        # всегда через VLESS, даже если домен российский
  direct_processes: []     # программы мимо VPN, например: [qbittorrent.exe]
  # Категории: готовые (preset: true, id из каталога: gov-bank-ru, ads, video,
  # social, ai, dev, games) и свои. Проверяются сверху вниз; направленные в
  # corp всегда выше частных сетей. Уступают proxy_domains и direct_domains,
  # приоритетнее российских правил.
  # action: auto | corp (OpenVPN) | proxy (VLESS) | direct | block
  # Типы правил своей категории: domain (с поддоменами), keyword (любой адрес,
  # где есть эта строка), cidr, process, ruleset (https-ссылка на .srs).
  categories: []
  #  - {id: ads, preset: true, action: block}
  #  - {id: social, preset: true, action: proxy}
  #  - id: work
  #    name: Рабочие инструменты
  #    action: direct
  #    rules:
  #      - {type: domain, value: figma.com}
  #      - {type: process, value: zoom.exe}

dns:
  direct: 77.88.8.8        # для российских доменов, напрямую
  remote: 1.1.1.1          # DNS-over-HTTPS через VLESS для остальных

tun:
  stack: mixed             # system | gvisor | mixed
  mtu: 9000
  ipv6: false              # false: IPv6 блокируется, чтобы не было утечек мимо VPN

singbox:
  path: ""                 # по умолчанию sing-box.exe рядом с vpnclient.exe
  log_level: warn          # trace | debug | info | warn | error
  clash_api: ""            # например 127.0.0.1:9090 для статистики
