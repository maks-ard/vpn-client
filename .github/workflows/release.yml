name: Release

# Релиз создаётся пушем тега вида v1.2.3 (git tag v0.1.0 && git push origin v0.1.0)
# или вручную: Actions → Release → Run workflow с версией — тогда тег на текущем
# коммите создаётся вместе с релизом.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      version:
        description: "Версия, например v0.1.0"
        required: true

permissions:
  contents: write

env:
  SING_BOX_VERSION: "1.14.3"
  VERSION: ${{ inputs.version || github.ref_name }}

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        arch: [amd64, arm64]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: check version
        run: '[[ "$VERSION" =~ ^v[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.]+)?$ ]] || { echo "неверная версия: $VERSION"; exit 1; }'
      - name: test
        run: go test ./...
      - name: download sing-box
        run: |
          name=sing-box-${SING_BOX_VERSION}-windows-${{ matrix.arch }}
          curl -fsSL -o sb.zip "https://github.com/SagerNet/sing-box/releases/download/v${SING_BOX_VERSION}/${name}.zip"
          unzip -q sb.zip
          # sing-box встраивается внутрь vpnclient.exe (тег embed_singbox)
          cp "${name}/sing-box.exe" internal/singboxbin/sing-box.exe
      - name: windows resources (иконка, манифест с правами администратора, версия)
        run: |
          go run github.com/tc-hib/go-winres@v0.3.3 make --in winres/winres.json \
            --arch ${{ matrix.arch }} --out cmd/vpnclient/rsrc \
            --product-version "${VERSION}" --file-version "${VERSION}"
      - name: build
        run: |
          exe=vpnclient-${VERSION}-windows-${{ matrix.arch }}.exe
          # -H windowsgui: приложение с окном, без консоли.
          GOOS=windows GOARCH=${{ matrix.arch }} CGO_ENABLED=0 go build -trimpath -tags embed_singbox,production \
            -ldflags "-s -w -H windowsgui -X main.version=${VERSION} -X github.com/maks-ard/vpn-client/internal/singboxbin.Version=${SING_BOX_VERSION}" \
            -o "${exe}" ./cmd/vpnclient
          sha256sum "${exe}" > "${exe}.sha256"
      - uses: actions/upload-artifact@v4
        with:
          name: windows-${{ matrix.arch }}
          path: vpnclient-*.exe*

  release:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - name: create release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cat > notes.md <<EOF
          ## Скачать

          \`vpnclient-${VERSION}-windows-amd64.exe\` — для обычных компьютеров, \`arm64\` — для ноутбуков на ARM.
          При первом запуске Windows один раз попросит права администратора: программа поставит
          себя в Program Files и зарегистрирует службу. Дальше она обновляется сама.
          Уже установленная версия 0.2+ обновится до этой автоматически в течение 6 часов
          (или сразу: Настройки → «Проверить обновления»).
          sing-box ${SING_BOX_VERSION} встроен внутрь.

          sing-box распространяется по лицензии GPLv3: https://github.com/SagerNet/sing-box
          EOF
          gh release create "$VERSION" dist/* \
            --repo "$GITHUB_REPOSITORY" \
            --target "$GITHUB_SHA" \
            --title "$VERSION" \
            --notes-file notes.md \
            --generate-notes
