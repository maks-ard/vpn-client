name: Release

# Релиз создаётся пушем тега вида v1.2.3:
#   git tag v0.1.0 && git push origin v0.1.0
on:
  push:
    tags: ["v*"]

permissions:
  contents: write

env:
  SING_BOX_VERSION: "1.14.3"

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        arch: [amd64, arm64]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: test
        run: go test ./...
      - name: build vpnclient.exe
        run: |
          mkdir -p pkg
          GOOS=windows GOARCH=${{ matrix.arch }} CGO_ENABLED=0 go build -trimpath \
            -ldflags "-s -w -X main.version=${GITHUB_REF_NAME}" \
            -o pkg/vpnclient.exe ./cmd/vpnclient
      - name: download sing-box
        run: |
          name=sing-box-${SING_BOX_VERSION}-windows-${{ matrix.arch }}
          curl -fsSL -o sb.zip "https://github.com/SagerNet/sing-box/releases/download/v${SING_BOX_VERSION}/${name}.zip"
          unzip -q sb.zip
          cp "${name}/sing-box.exe" pkg/
          cp "${name}/LICENSE" pkg/sing-box-LICENSE.txt
      - name: package
        run: |
          cp profiles/example.yaml pkg/profile.example.yaml
          cp scripts/connect.cmd pkg/connect.cmd
          cp README.md pkg/README.md
          zip_name=vpnclient-${GITHUB_REF_NAME}-windows-${{ matrix.arch }}.zip
          (cd pkg && zip -q -r "../${zip_name}" .)
          sha256sum "${zip_name}" > "${zip_name}.sha256"
      - uses: actions/upload-artifact@v4
        with:
          name: windows-${{ matrix.arch }}
          path: vpnclient-*.zip*

  release:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - name: create release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cat > notes.md <<EOF
          ## Установка на Windows

          1. Скачайте \`vpnclient-${GITHUB_REF_NAME}-windows-amd64.zip\` (для ARM-ноутбуков — \`arm64\`) и распакуйте в отдельную папку.
          2. Переименуйте \`profile.example.yaml\` в \`profile.yaml\`, впишите ссылку \`vless://…\` и положите рядом свой \`.ovpn\`.
          3. Запустите \`connect.cmd\` — он попросит права администратора и подключит VPN. Закройте окно или нажмите Ctrl+C, чтобы отключиться.

          В архиве sing-box ${SING_BOX_VERSION} (официальная сборка, лицензия GPLv3 — \`sing-box-LICENSE.txt\`).
          EOF
          gh release create "$GITHUB_REF_NAME" dist/* \
            --repo "$GITHUB_REPOSITORY" \
            --title "$GITHUB_REF_NAME" \
            --notes-file notes.md \
            --generate-notes
