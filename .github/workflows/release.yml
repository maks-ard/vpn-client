name: Release

# Релиз создаётся пушем тега вида v1.2.3:
#   git tag v0.1.0 && git push origin v0.1.0
on:
  push:
    tags: ["v*"]

permissions:
  contents: write

env:
  SING_BOX_VERSION: "1.14.3"

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        arch: [amd64, arm64]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: test
        run: go test ./...
      - name: download sing-box
        run: |
          name=sing-box-${SING_BOX_VERSION}-windows-${{ matrix.arch }}
          curl -fsSL -o sb.zip "https://github.com/SagerNet/sing-box/releases/download/v${SING_BOX_VERSION}/${name}.zip"
          unzip -q sb.zip
          # sing-box встраивается внутрь vpnclient.exe (тег embed_singbox)
          cp "${name}/sing-box.exe" internal/singboxbin/sing-box.exe
      - name: windows resources (манифест с правами администратора, версия)
        run: |
          go run github.com/tc-hib/go-winres@v0.3.3 make --in winres/winres.json \
            --arch ${{ matrix.arch }} --out cmd/vpnclient/rsrc \
            --product-version "${GITHUB_REF_NAME}" --file-version "${GITHUB_REF_NAME}"
      - name: build
        run: |
          exe=vpnclient-${GITHUB_REF_NAME}-windows-${{ matrix.arch }}.exe
          GOOS=windows GOARCH=${{ matrix.arch }} CGO_ENABLED=0 go build -trimpath -tags embed_singbox \
            -ldflags "-s -w -X main.version=${GITHUB_REF_NAME}" \
            -o "${exe}" ./cmd/vpnclient
          sha256sum "${exe}" > "${exe}.sha256"
      - uses: actions/upload-artifact@v4
        with:
          name: windows-${{ matrix.arch }}
          path: vpnclient-*.exe*

  release:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - name: create release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cat > notes.md <<EOF
          ## Скачать

          \`vpnclient-${GITHUB_REF_NAME}-windows-amd64.exe\` — для обычных компьютеров, \`arm64\` — для ноутбуков на ARM.
          Это один файл: sing-box ${SING_BOX_VERSION} встроен внутрь. Windows при запуске запросит права администратора,
          они нужны для перехвата трафика.

          sing-box распространяется по лицензии GPLv3: https://github.com/SagerNet/sing-box
          EOF
          gh release create "$GITHUB_REF_NAME" dist/* \
            --repo "$GITHUB_REPOSITORY" \
            --title "$GITHUB_REF_NAME" \
            --notes-file notes.md \
            --generate-notes
